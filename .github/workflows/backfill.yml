name: COTAHIST Backfill Proof

on:
  push:
    branches: [main]
    paths:
      - "src/bolsabr/b3/cotahist.py"
      - "src/bolsabr/backfill/**"
      - "src/bolsabr/serving/**"
      - "scripts/backfill_cotahist.py"
      - "tests/test_cotahist.py"
      - "tests/test_backfill_cotahist.py"
      - ".github/workflows/backfill.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cotahist-backfill-${{ github.ref }}
  cancel-in-progress: true

jobs:
  live-backfill:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install
        run: pip install -e ".[dev]"

      - name: Unit tests
        run: |
          pytest -q             tests/test_cotahist.py             tests/test_backfill_cotahist.py             tests/test_snapshot_store.py             tests/test_api.py

      - name: Register PETRJ510 from known B3 contract metadata
        run: |
          cat > /tmp/petr4-registry-seed.json <<'JSON'
          {
            "schema_version": "0.1",
            "ref_date": "2026-09-23",
            "market_data_source": "B3_EOD",
            "rate_source": "B3_DI1",
            "underlying": {
              "ticker": "PETR4",
              "spot": 49.60
            },
            "fallback_risk_free_rate": 0.12,
            "dividend_yield": 0.0,
            "expirations": [
              {
                "date": "2026-10-16",
                "type": "MONTHLY",
                "dte_calendar": 23,
                "dte_business": 16,
                "risk_free_rate": 0.125,
                "rows": [
                  {
                    "strike": 49.86,
                    "call": {
                      "ticker": "PETRJ510",
                      "type": "CALL",
                      "exercise_style": "AMERICAN",
                      "pricing_model": null,
                      "market": {},
                      "analytics_input": {},
                      "analytics": {}
                    },
                    "put": null
                  }
                ]
              }
            ]
          }
          JSON

          python scripts/publish_snapshot.py             /tmp/petr4-registry-seed.json             --snapshot-dir /tmp/bolsabr-serving

      - name: Backfill PETRJ510 from annual B3 COTAHIST
        run: |
          python scripts/backfill_cotahist.py             2026 PETR4             --snapshot-dir /tmp/bolsabr-serving             --start 2026-08-01             --end 2026-09-23             | tee /tmp/backfill-summary.json

      - name: Validate backfilled market history
        run: |
          python - <<'PY'
          from datetime import date

          from bolsabr.serving.snapshot_store import FilesystemSnapshotStore

          store = FilesystemSnapshotStore("/tmp/bolsabr-serving")
          history = store.contract_history("PETRJ510")

          assert history["observations"] > 2, history
          backfill = [
              point
              for point in history["points"]
              if point["source"] == "B3_COTAHIST_BACKFILL"
          ]
          assert backfill, history
          assert min(point["ref_date"] for point in backfill) < "2026-09-23"

          market_points = [
              point for point in backfill
              if point["last"] is not None
          ]
          assert market_points, backfill

          for point in backfill:
              assert point["open_interest"] is None
              assert point["iv"] is None

          print(
              "PETRJ510",
              "observations=", history["observations"],
              "backfill=", len(backfill),
              "first=", history["start_date"],
              "last=", history["end_date"],
          )
          PY

      - uses: actions/upload-artifact@v4
        with:
          name: cotahist-backfill-proof
          path: /tmp/backfill-summary.json
          retention-days: 14
