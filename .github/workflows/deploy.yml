name: Deployment QA

on:
  push:
    branches: [main]
    paths:
      - "deploy/**"
      - "apps/web/app/healthz/**"
      - ".github/workflows/deploy.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deployment-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Validate Compose topology
        env:
          BOLSABR_SITE_URL: https://staging.example.com
          BOLSABR_API_BASE_URL: http://api:8000
        run: |
          docker compose -f deploy/compose.yml config > /tmp/compose.yml
          grep -q 'api:' /tmp/compose.yml
          grep -q 'web:' /tmp/compose.yml
          grep -q 'publisher:' /tmp/compose.yml
          grep -q 'bolsabr_snapshots:' /tmp/compose.yml
          grep -q 'https://staging.example.com' /tmp/compose.yml
          grep -q 'http://api:8000' /tmp/compose.yml
          grep -q 'time.sleep(10' /tmp/compose.yml

      - name: Test scheduled publisher entrypoint
        run: |
          pip install -e ".[dev]"
          pytest -q tests/test_publisher_entrypoint.py

      - name: Build EOD publisher image
        run: docker build -f deploy/worker/Dockerfile -t bolsabr-publisher:test .

      - name: Validate publisher command without network execution
        run: |
          docker inspect bolsabr-publisher:test             --format '{{json .Config.Cmd}}' > /tmp/cmd.json
          grep -q 'run_eod_publisher.py' /tmp/cmd.json

      - name: Validate staging environment template
        run: |
          grep -q '^BOLSABR_SITE_URL=https://' deploy/staging.env.example
          grep -q '^BOLSABR_API_BASE_URL=http://api:8000' deploy/staging.env.example
          grep -q '^BOLSABR_UNIVERSE_MODE=auto' deploy/staging.env.example
          grep -q '^BOLSABR_UNIVERSE_KIND=stocks' deploy/staging.env.example
          grep -q '^BOLSABR_UNIVERSE_LIMIT=50' deploy/staging.env.example
