name: Staging Smoke

on:
  workflow_dispatch:
    inputs:
      base_url:
        description: "Optional staging URL override. Otherwise uses BOLSABR_STAGING_URL secret."
        required: false
        type: string
      min_assets:
        description: "Minimum published assets expected."
        required: false
        default: "50"
        type: string

permissions:
  contents: read

concurrency:
  group: staging-smoke
  cancel-in-progress: true

jobs:
  smoke:
    runs-on: ubuntu-latest
    environment: staging
    env:
      TARGET_URL: ${{ inputs.base_url || secrets.BOLSABR_STAGING_URL }}
      MIN_ASSETS: ${{ inputs.min_assets || '50' }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Validate staging URL
        run: |
          if [ -z "$TARGET_URL" ]; then
            echo "Missing staging URL."
            echo "Provide workflow input base_url or configure the staging environment secret BOLSABR_STAGING_URL."
            exit 1
          fi
          case "$TARGET_URL" in
            https://*) ;;
            *)
              echo "Staging must use HTTPS: $TARGET_URL"
              exit 1
              ;;
          esac

      - name: Run remote smoke
        run: |
          mkdir -p artifacts
          python scripts/staging_smoke.py             "$TARGET_URL"             --ticker PETR4             --min-assets "$MIN_ASSETS"             --require-https             | tee artifacts/staging-smoke.json

      - name: Write summary
        run: |
          echo "## BOLSABR staging smoke" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "- URL: `$TARGET_URL`" >> "$GITHUB_STEP_SUMMARY"
          echo "- minimum assets: **$MIN_ASSETS**" >> "$GITHUB_STEP_SUMMARY"
          echo "- result: **success**" >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v4
        with:
          name: staging-smoke
          path: artifacts/staging-smoke.json
          retention-days: 14
