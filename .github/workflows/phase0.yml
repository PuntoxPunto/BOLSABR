name: Phase 0 - PETR4 Proof of Data

on:
  push:
    branches: [main]
    paths:
      - "src/**"
      - "tests/**"
      - "scripts/**"
      - "pyproject.toml"
      - ".github/workflows/phase0.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: phase0-${{ github.ref }}
  cancel-in-progress: true

jobs:
  unit-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install
        run: python -m pip install -e ".[dev]"
      - name: Test
        run: pytest -q

  live-b3-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install
        run: python -m pip install -e ".[dev]"
      - name: Download B3 data and assemble PETR4 chain
        run: python scripts/b3_smoke.py
      - name: Upload smoke report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: b3-petr4-smoke
          path: artifacts/*.json
          if-no-files-found: warn
          retention-days: 14
