name: API Production QA

on:
  push:
    branches: [main]
    paths:
      - "src/bolsabr/api/**"
      - "src/bolsabr/serving/**"
      - "tests/test_api.py"
      - "tests/test_snapshot_store.py"
      - "scripts/publish_snapshot.py"
      - "pyproject.toml"
      - "deploy/api/**"
      - ".github/workflows/api.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: api-production-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: pip install -e ".[dev]"
      - name: API and snapshot tests
        run: pytest -q tests/test_snapshot_store.py tests/test_api.py
      - name: Build API image
        run: docker build -f deploy/api/Dockerfile -t bolsabr-api:test .
