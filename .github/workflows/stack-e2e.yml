name: Stack E2E

on:
  push:
    branches: [main]
    paths:
      - "apps/web/**"
      - "src/bolsabr/api/**"
      - "src/bolsabr/serving/**"
      - "scripts/publish_snapshot.py"
      - "scripts/staging_smoke.py"
      - "tests/fixtures/option-chain-v0-e2e.json"
      - "pyproject.toml"
      - ".github/workflows/stack-e2e.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: stack-e2e-${{ github.ref }}
  cancel-in-progress: true

jobs:
  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install API
        run: pip install -e .

      - name: Prepare and publish multiasset E2E history
        run: |
          python - <<'PY'
          import copy
          import json
          from pathlib import Path

          base = json.loads(
              Path("tests/fixtures/option-chain-v0-e2e.json").read_text()
          )

          def write_snapshot(
              path,
              *,
              ticker,
              ref_date,
              spot,
              contract,
              last,
              iv,
              open_interest,
              volume,
          ):
              payload = copy.deepcopy(base)
              payload["ref_date"] = ref_date
              payload["underlying"]["ticker"] = ticker
              payload["underlying"]["spot"] = spot
              leg = payload["expirations"][0]["rows"][0]["call"]
              leg["ticker"] = contract
              leg["market"]["last"] = last
              leg["market"]["bid"] = round(last - 0.10, 2)
              leg["market"]["ask"] = round(last + 0.10, 2)
              leg["market"]["open_interest"] = open_interest
              leg["market"]["volume"] = volume
              leg["analytics_input"]["price"] = last
              leg["analytics"]["iv"] = iv
              Path(path).write_text(json.dumps(payload))

          write_snapshot(
              "/tmp/PETR4-2026-09-22.json",
              ticker="PETR4",
              ref_date="2026-09-22",
              spot=121.00,
              contract="PETRJ123",
              last=4.00,
              iv=0.38,
              open_interest=20000,
              volume=8000,
          )
          write_snapshot(
              "/tmp/PETR4-2026-09-23.json",
              ticker="PETR4",
              ref_date="2026-09-23",
              spot=122.00,
              contract="PETRJ123",
              last=4.20,
              iv=0.40,
              open_interest=22000,
              volume=9000,
          )
          write_snapshot(
              "/tmp/PETR4-2026-09-24.json",
              ticker="PETR4",
              ref_date="2026-09-24",
              spot=123.45,
              contract="PETRJ123",
              last=4.50,
              iv=0.42,
              open_interest=25000,
              volume=10000,
          )
          write_snapshot(
              "/tmp/VALE3.json",
              ticker="VALE3",
              ref_date="2026-09-24",
              spot=234.56,
              contract="VALEJ123",
              last=5.50,
              iv=0.35,
              open_interest=12000,
              volume=7000,
          )
          write_snapshot(
              "/tmp/ITUB4.json",
              ticker="ITUB4",
              ref_date="2026-09-24",
              spot=345.67,
              contract="ITUBJ123",
              last=6.50,
              iv=0.32,
              open_interest=15000,
              volume=7500,
          )

          # PETRJOLD exists on 22/23 and intentionally disappears from
          # the 24/09 latest snapshot. The contract registry must preserve it.
          for path, last, iv in [
              ("/tmp/PETR4-2026-09-22.json", 7.00, 0.36),
              ("/tmp/PETR4-2026-09-23.json", 7.20, 0.37),
          ]:
              payload = json.loads(Path(path).read_text())
              old_row = copy.deepcopy(payload["expirations"][0]["rows"][0])
              old_row["strike"] = 120.00
              old_leg = old_row["call"]
              old_leg["ticker"] = "PETRJOLD"
              old_leg["market"]["last"] = last
              old_leg["market"]["bid"] = round(last - 0.10, 2)
              old_leg["market"]["ask"] = round(last + 0.10, 2)
              old_leg["market"]["open_interest"] = 5000
              old_leg["market"]["volume"] = 2500
              old_leg["analytics_input"]["price"] = last
              old_leg["analytics"]["iv"] = iv
              payload["expirations"][0]["rows"].append(old_row)
              Path(path).write_text(json.dumps(payload))
          PY

          for file in             /tmp/PETR4-2026-09-22.json             /tmp/PETR4-2026-09-23.json             /tmp/PETR4-2026-09-24.json             /tmp/VALE3.json             /tmp/ITUB4.json; do
            python scripts/publish_snapshot.py               "$file"               --snapshot-dir /tmp/bolsabr-serving
          done

      - name: Start API
        env:
          BOLSABR_SNAPSHOT_DIR: /tmp/bolsabr-serving
        run: |
          uvicorn bolsabr.api.app:app --host 127.0.0.1 --port 8000 >/tmp/bolsabr-api.log 2>&1 &
          echo $! > /tmp/bolsabr-api.pid
          for i in {1..30}; do
            curl -fsS http://127.0.0.1:8000/healthz >/dev/null && exit 0
            sleep 1
          done
          cat /tmp/bolsabr-api.log
          exit 1

      - name: Verify API snapshots, assets and option contracts
        run: |
          python - <<'PY'
          import json
          import urllib.parse
          import urllib.request

          def get(path):
              with urllib.request.urlopen("http://127.0.0.1:8000" + path) as response:
                  return json.load(response)

          chain = get("/v1/assets/PETR4/options")
          assert chain["underlying"]["ticker"] == "PETR4"
          assert chain["underlying"]["spot"] == 123.45

          expiry = get("/v1/assets/PETR4/options?expiration=2026-10-16")
          assert expiry["expirations"][0]["date"] == "2026-10-16"
          assert expiry["expirations"][0]["rows"][0]["call"]["ticker"] == "PETRJ123"

          assets = get("/v1/assets")
          assert {item["ticker"] for item in assets["assets"]} == {
              "PETR4", "VALE3", "ITUB4"
          }

          contract = get("/v1/options/PETRJ123")
          assert contract["underlying"] == {"ticker": "PETR4", "spot": 123.45}
          assert contract["contract"]["ticker"] == "PETRJ123"
          assert contract["contract"]["strike"] == 123.0

          catalog = get("/v1/options?underlying=PETR4&limit=10")
          assert catalog["total"] == 2
          assert {item["ticker"] for item in catalog["contracts"]} == {
              "PETRJ123", "PETRJOLD"
          }

          archived = get("/v1/options/PETRJOLD")
          assert archived["ref_date"] == "2026-09-23"
          assert archived["contract"]["ticker"] == "PETRJOLD"
          assert archived["contract"]["strike"] == 120.0

          archived_history = get("/v1/options/PETRJOLD/history")
          assert archived_history["observations"] == 2
          assert [
              point["ref_date"]
              for point in archived_history["points"]
          ] == ["2026-09-22", "2026-09-23"]

          latest_contracts = {
              row["call"]["ticker"]
              for row in chain["expirations"][0]["rows"]
              if row.get("call")
          }
          assert "PETRJOLD" not in latest_contracts

          history = get("/v1/options/PETRJ123/history")
          assert history["observations"] == 3
          assert [point["ref_date"] for point in history["points"]] == [
              "2026-09-22",
              "2026-09-23",
              "2026-09-24",
          ]
          assert [point["last"] for point in history["points"]] == [
              4.00, 4.20, 4.50
          ]
          assert [point["iv"] for point in history["points"]] == [
              0.38, 0.40, 0.42
          ]
          assert [point["open_interest"] for point in history["points"]] == [
              20000, 22000, 25000
          ]
          PY

      - uses: actions/setup-node@v5
        with:
          node-version: "22"

      - name: Install web
        working-directory: apps/web
        run: npm install --no-audit --no-fund

      - name: Build web
        working-directory: apps/web
        env:
          NEXT_TELEMETRY_DISABLED: "1"
          BOLSABR_SITE_URL: http://127.0.0.1:3000
        run: npm run build

      - name: Start web against API
        working-directory: apps/web
        env:
          NEXT_TELEMETRY_DISABLED: "1"
          BOLSABR_API_BASE_URL: http://127.0.0.1:8000
          BOLSABR_SITE_URL: http://127.0.0.1:3000
        run: |
          npm run start >/tmp/bolsabr-web.log 2>&1 &
          echo $! > /tmp/bolsabr-web.pid
          for i in {1..30}; do
            curl -fsS http://127.0.0.1:3000/acoes/PETR4/opcoes >/tmp/page.html && exit 0
            sleep 1
          done
          cat /tmp/bolsabr-web.log
          exit 1

      - name: Prove Next consumes API over HTTP
        run: |
          curl -fsS http://127.0.0.1:3000/acoes/PETR4/opcoes > /tmp/page.html
          grep -q '123,45' /tmp/page.html
          grep -q 'PETRJ123' /tmp/page.html

          curl -fsS http://127.0.0.1:3000/acoes/VALE3/opcoes > /tmp/vale.html
          grep -q '234,56' /tmp/vale.html
          grep -q 'VALEJ123' /tmp/vale.html

          curl -fsS http://127.0.0.1:3000/acoes/ITUB4/opcoes > /tmp/itub.html
          grep -q '345,67' /tmp/itub.html
          grep -q 'ITUBJ123' /tmp/itub.html

          curl -fsS http://127.0.0.1:3000/opcoes/PETRJ123 > /tmp/contract.html
          grep -q 'PETRJ123' /tmp/contract.html
          grep -q 'strike R$ 123,00' /tmp/contract.html
          grep -q 'rel="canonical"' /tmp/contract.html
          grep -q 'http://127.0.0.1:3000/opcoes/PETRJ123' /tmp/contract.html
          grep -q 'Evolução do contrato' /tmp/contract.html

          curl -fsS http://127.0.0.1:3000/opcoes/PETRJOLD > /tmp/archived.html
          grep -q 'PETRJOLD' /tmp/archived.html
          grep -q 'strike R$ 120,00' /tmp/archived.html
          grep -q '23/09/2026' /tmp/archived.html

          curl -fsS http://127.0.0.1:3000/sitemap.xml > /tmp/sitemap.xml
          grep -q 'http://127.0.0.1:3000/acoes/PETR4/opcoes' /tmp/sitemap.xml
          grep -q 'http://127.0.0.1:3000/acoes/VALE3/opcoes' /tmp/sitemap.xml
          grep -q 'http://127.0.0.1:3000/acoes/ITUB4/opcoes' /tmp/sitemap.xml
          ! grep -q '/opcoes/PETRJ123' /tmp/sitemap.xml

          curl -fsS http://127.0.0.1:3000/robots.txt > /tmp/robots.txt
          grep -q 'Sitemap: http://127.0.0.1:3000/sitemap.xml' /tmp/robots.txt
          grep -q 'Sitemap: http://127.0.0.1:3000/opcoes/sitemap/PETR4.xml' /tmp/robots.txt
          grep -q 'Sitemap: http://127.0.0.1:3000/opcoes/sitemap/VALE3.xml' /tmp/robots.txt
          grep -q 'Sitemap: http://127.0.0.1:3000/opcoes/sitemap/ITUB4.xml' /tmp/robots.txt

          curl -fsS http://127.0.0.1:3000/opcoes/sitemap/PETR4.xml > /tmp/petr-sitemap.xml
          grep -q 'http://127.0.0.1:3000/opcoes/PETRJ123' /tmp/petr-sitemap.xml
          grep -q 'http://127.0.0.1:3000/opcoes/PETRJOLD' /tmp/petr-sitemap.xml

          curl -fsS http://127.0.0.1:3000/opcoes/sitemap/VALE3.xml > /tmp/vale-sitemap.xml
          grep -q 'http://127.0.0.1:3000/opcoes/VALEJ123' /tmp/vale-sitemap.xml

          curl -fsS http://127.0.0.1:3000/opcoes/sitemap/ITUB4.xml > /tmp/itub-sitemap.xml
          grep -q 'http://127.0.0.1:3000/opcoes/ITUBJ123' /tmp/itub-sitemap.xml

          test "$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:3000/acoes/ABCD3/opcoes)" = "404"
          test "$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:3000/opcoes/ABCDJ999)" = "404"

      - name: Validate reusable staging smoke against local stack
        run: |
          python scripts/staging_smoke.py             http://127.0.0.1:3000             --ticker PETR4             --min-assets 3

      - name: Install Chromium for search navigation E2E
        working-directory: apps/web
        run: |
          npm install --no-save playwright@1.55.0
          npx playwright install --with-deps chromium

      - name: Navigate between published assets from search
        working-directory: apps/web
        run: |
          node --input-type=module - <<'JS'
          import { chromium } from "playwright";

          const browser = await chromium.launch({ headless: true });
          const page = await browser.newPage({ viewport: { width: 1280, height: 900 } });

          await page.goto("http://127.0.0.1:3000/acoes/PETR4/opcoes");
          const search = page.locator("#asset-search");

          await search.fill("VALE3");
          await page.locator(".asset-suggestion", { hasText: "VALE3" }).click();
          await page.waitForURL("**/acoes/VALE3/opcoes");
          if ((await page.locator("h1").textContent())?.trim() !== "VALE3") {
            throw new Error("Search did not navigate to VALE3");
          }

          await search.fill("ITUB4");
          await page.locator(".asset-suggestion", { hasText: "ITUB4" }).click();
          await page.waitForURL("**/acoes/ITUB4/opcoes");
          if ((await page.locator("h1").textContent())?.trim() !== "ITUB4") {
            throw new Error("Search did not navigate to ITUB4");
          }

          await page.goto("http://127.0.0.1:3000/acoes/PETR4/opcoes");
          const contractCell = page.locator(".cell-button", { hasText: "PETRJ123" }).first();
          await contractCell.click();
          await page.locator(".contract-page-link").click();
          await page.waitForURL("**/opcoes/PETRJ123");
          if ((await page.locator("h1").textContent())?.trim() !== "PETRJ123") {
            throw new Error("Drawer did not navigate to PETRJ123 detail page");
          }

          await page.locator(".history-section").waitFor();
          const historyText = await page.locator(".history-section").textContent();
          if (!historyText?.includes("3 observações")) {
            throw new Error("History summary does not report three observations");
          }
          if (await page.locator(".history-card").count() !== 4) {
            throw new Error("Expected four EOD history charts");
          }
          if (await page.locator(".history-empty").count() !== 0) {
            throw new Error("Three-day history should render charts, not empty states");
          }
          if (await page.locator(".history-point").count() !== 12) {
            throw new Error("Expected three real points in each of four charts");
          }

          const firstPoint = page.locator(".history-point").first();
          await firstPoint.focus();
          if (!(await firstPoint.getAttribute("aria-label"))?.includes("22/09/2026")) {
            throw new Error("History point does not preserve observation date");
          }

          await page.goto("http://127.0.0.1:3000/opcoes/PETRJOLD");
          if ((await page.locator("h1").textContent())?.trim() !== "PETRJOLD") {
            throw new Error("Archived contract page disappeared");
          }
          const archivedHistory = await page.locator(".history-section").textContent();
          if (!archivedHistory?.includes("2 observações")) {
            throw new Error("Archived contract history was not preserved");
          }

          await browser.close();
          JS
