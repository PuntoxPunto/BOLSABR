name: bolsabr

services:
  api:
    build:
      context: ..
      dockerfile: deploy/api/Dockerfile
    environment:
      BOLSABR_SNAPSHOT_DIR: /data/serving
      PORT: "8000"
    volumes:
      - bolsabr_snapshots:/data/serving:ro
    expose:
      - "8000"
    restart: unless-stopped

  web:
    build:
      context: ../apps/web
      dockerfile: Dockerfile
    environment:
      BOLSABR_API_BASE_URL: http://api:8000
      PORT: "3000"
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "${BOLSABR_WEB_PORT:-3000}:3000"
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3000/healthz').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"
        ]
      interval: 30s
      timeout: 5s
      start_period: 10s
      retries: 3
    restart: unless-stopped

  publisher:
    build:
      context: ..
      dockerfile: deploy/worker/Dockerfile
    environment:
      BOLSABR_SNAPSHOT_DIR: /data/serving
      BOLSABR_UNDERLYINGS: "${BOLSABR_UNDERLYINGS:-PETR4}"
    volumes:
      - bolsabr_snapshots:/data/serving
    profiles:
      - jobs
    restart: "no"

volumes:
  bolsabr_snapshots:
